<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おはようVtuber ポートレートフレーム生成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cinzel:wght@400;500;700&family=EB+Garamond:wght@500;600;700;800&family=Oswald:wght@400;600;700&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f7; --card:#ffffff; --line:#e2e6ec; --fg:#1b2028; --dim:#79808c;
  --accent:#f5992b; --accent-ink:#3a2405; --focus:#2f6df6;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  font-size:15px; line-height:1.6;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
header{
  padding:15px 16px; border-bottom:1px solid var(--line);
  position:sticky; top:0; background:rgba(255,255,255,.9); backdrop-filter:blur(10px); z-index:20;
}
header h1{margin:0; font-size:16px; font-weight:900; letter-spacing:.03em}
main{max-width:1180px; margin:0 auto; padding:16px 14px 90px}
main > section, main > .stage{margin-bottom:20px}
/* スマホ（1カラム）では、プレビューのすぐ下に位置・大きさを置いて
   結果を見ながら調整できるようにする。画面に収まるよう高さも抑える。 */
.canvas-wrap{max-width:min(100%, 54vh); margin:0 auto}
@media(min-width:940px){
  main{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,470px); gap:26px; align-items:start}
  .s-mode{grid-column:1; grid-row:1}
  .s-upload{grid-column:1; grid-row:2}
  .s-adjust{grid-column:1; grid-row:3}
  .s-text{grid-column:1; grid-row:4}
  .stage{grid-column:2; grid-row:1 / 5; position:sticky; top:78px}
  .canvas-wrap{max-width:100%}
}
.label{font-size:12px; font-weight:800; letter-spacing:.06em; color:var(--dim); margin:0 0 9px}

/* ---- モードタブ ---- */
.tabs{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:#5a616d;
  border-radius:999px; padding:10px 16px; font-size:13.5px; font-weight:700; cursor:pointer;
  white-space:nowrap; transition:.15s; font-family:inherit;
}
.tab:hover{border-color:#c9d0da}
.tab[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}

/* ---- アップロード ---- */
.drop{
  border:1.5px dashed #ccd3dd; border-radius:var(--r); background:var(--card);
  padding:22px; text-align:center; cursor:pointer; transition:.15s;
}
.drop.over{border-color:var(--accent); background:#fff8ee}
.drop.has{padding:12px; text-align:left; display:flex; gap:12px; align-items:center}
.drop input[type=file]{display:none}
.drop .ph{font-size:14px; font-weight:700; color:#5a616d}
.thumb{
  width:60px; height:60px; flex:0 0 auto; border-radius:9px; border:1px solid var(--line);
  background:
    linear-gradient(45deg,#eceff3 25%,transparent 25%,transparent 75%,#eceff3 75%),
    linear-gradient(45deg,#eceff3 25%,#fff 25%,#fff 75%,#eceff3 75%);
  background-size:14px 14px; background-position:0 0,7px 7px;
  object-fit:contain;
}
.finfo{min-width:0; flex:1; font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mini{background:var(--card); border:1px solid var(--line); color:#5a616d; border-radius:9px; padding:7px 12px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit}
.mini:hover{border-color:#c9d0da}

/* ---- 立ち絵の調整 ---- */
.adj{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px}
.adj .row{display:flex; align-items:center; gap:12px; margin-bottom:9px}
.adj .row span{font-size:12.5px; font-weight:700; color:var(--dim); width:46px; flex:0 0 auto}
.adj .row input[type=range]{flex:1; min-width:0; -webkit-appearance:none; appearance:none; height:22px; background:transparent}
.adj .row input[type=range]::-webkit-slider-runnable-track{height:6px; border-radius:3px; background:#e6eaf0}
.adj .row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:20px; height:20px; margin-top:-7px; border-radius:50%; background:var(--accent); border:2px solid #fff; box-shadow:0 1px 4px rgba(27,32,40,.25)}
.adj .row input[type=range]::-moz-range-track{height:6px; border-radius:3px; background:#e6eaf0}
.adj .row input[type=range]::-moz-range-progress{height:6px; border-radius:3px; background:var(--accent)}
.adj .row input[type=range]::-moz-range-thumb{width:18px; height:18px; border:2px solid #fff; border-radius:50%; background:var(--accent)}
.adj .row b{font-size:12.5px; width:50px; text-align:right; font-variant-numeric:tabular-nums; font-weight:700}
.adj .foot{display:flex; justify-content:flex-end}

/* ---- フォーム ---- */
.field{margin-bottom:13px}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--dim); margin-bottom:5px}
.field .toggle{display:flex; align-items:center; gap:10px; cursor:pointer; margin:0;
  background:var(--card); border:1px solid var(--line); border-radius:10px; padding:11px 13px;
  font-size:14px; font-weight:700; color:var(--fg)}
.field .toggle input{width:19px; height:19px; margin:0; accent-color:var(--accent); cursor:pointer}
input[type=text],textarea{
  width:100%; background:var(--card); border:1px solid var(--line); color:var(--fg);
  border-radius:10px; padding:11px 13px; font-size:15px; font-family:inherit; line-height:1.5;
  transition:.15s;
}
input[type=text]:focus,textarea:focus{outline:none; border-color:var(--focus); box-shadow:0 0 0 3px rgba(47,109,246,.12)}
textarea{resize:vertical; min-height:76px}
::placeholder{color:#a8afba}

/* ---- ステージ ---- */
.canvas-wrap{
  position:relative; border-radius:var(--r); overflow:hidden; background:var(--card);
  border:1px solid var(--line); aspect-ratio:1/1;
}
.canvas-wrap canvas{display:block; width:100%; height:100%}
.spinner{
  position:absolute; inset:0; display:none; align-items:center; justify-content:center;
  background:rgba(255,255,255,.78); backdrop-filter:blur(2px); z-index:5;
}
.spinner.on{display:flex}
.spinner i{
  width:32px; height:32px; border:3px solid rgba(27,32,40,.14); border-top-color:var(--accent);
  border-radius:50%; animation:spin .8s linear infinite; display:block;
}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:#a8afba; font-size:14px; font-weight:700;
}
.actions{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
button.act{
  border:none; border-radius:12px; padding:15px 12px; font-size:14.5px; font-weight:800;
  cursor:pointer; font-family:inherit; transition:.15s; letter-spacing:.02em;
}
button.act:disabled{opacity:.4; cursor:not-allowed}
.act.save{background:var(--accent); color:var(--accent-ink)}
.act.share{background:#16181d; color:#fff}
.toast{
  position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); opacity:0; pointer-events:none;
  background:#1b2028; color:#fff; padding:11px 18px; border-radius:999px; font-size:13px; font-weight:700;
  transition:.25s; z-index:100; max-width:88vw; text-align:center;
}
.toast.on{opacity:1; transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <h1>おはようVtuber ポートレートフレーム</h1>
</header>

<main>
  <section class="s-mode">
    <p class="label">モード</p>
    <div class="tabs" id="tabs" role="tablist"></div>
  </section>

  <section class="s-upload">
    <p class="label">立ち絵</p>
    <div class="drop" id="drop">
      <input type="file" id="file" accept="image/*">
      <div class="ph">タップして画像を選択</div>
    </div>
  </section>

  <div class="stage">
    <div class="canvas-wrap">
      <canvas id="preview" width="1350" height="1350"></canvas>
      <div class="empty" id="empty">立ち絵をアップロード</div>
      <div class="spinner" id="spinner"><i></i></div>
    </div>
    <div class="actions">
      <button class="act save" id="btnSave" disabled>画像を保存</button>
      <button class="act share" id="btnShare" disabled>Xに投稿</button>
    </div>
  </div>

  <section class="s-adjust">
    <p class="label">位置・大きさ</p>
    <div class="adj" id="adjust">
      <div class="row"><span>大きさ</span><input type="range" id="adjScale" min="40" max="400" step="1" value="100"><b id="adjScaleV">100%</b></div>
      <div class="row"><span>左右</span><input type="range" id="adjX" min="-120" max="120" step="1" value="0"><b id="adjXV">0</b></div>
      <div class="row"><span>上下</span><input type="range" id="adjY" min="-200" max="200" step="1" value="0"><b id="adjYV">0</b></div>
      <div class="foot"><button class="mini" type="button" id="adjReset">リセット</button></div>
    </div>
  </section>

  <section class="s-text">
    <p class="label">テキスト</p>
    <div id="fields"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================================
 *  おはようVtuber ポートレートフレーム生成ツール
 *  - 出力: 1350 x 1350 (1:1)
 *  - 入力: 背景透過PNG前提（不透明画像でも破綻しないようフォールバック）
 *  - 依存ライブラリなし / Canvas2D + WebGL2 のみ
 *  構成: [1]共通ユーティリティ [2]WebGL2コア [3]シェーダ [4]フィルタ
 *        [5]描画プリミティブ [6]5モード定義 [7]アプリ本体
 * ====================================================================== */

const OUT = 1350;               // 出力解像度（正方形）

/* =========================================================================
 * [1] 共通ユーティリティ
 * ====================================================================== */

const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const rnd = (s) => { // 決定的な擬似乱数（同じ入力で同じ絵になるように）
  let x = s | 0 || 1;
  return () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return ((x >>> 0) % 100000) / 100000; };
};
function debounce(fn, ms) {
  let t = 0;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}
function newCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/* ---- 色 ---- */
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  let h = 0, s = 0; const l = (mx + mn) / 2;
  const d = mx - mn;
  if (d > 0.0001) {
    s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    if (mx === r) h = ((g - b) / d + (g < b ? 6 : 0));
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h /= 6;
  }
  return [h * 360, s, l];
}
function hsl(h, s, l, a) {
  h = ((h % 360) + 360) % 360;
  return `hsla(${h.toFixed(1)},${(clamp(s, 0, 1) * 100).toFixed(1)}%,${(clamp(l, 0, 1) * 100).toFixed(1)}%,${a === undefined ? 1 : a})`;
}

/* ---- 画像解析 ----------------------------------------------------------
 * 透過PNGを前提に、被写体の外接矩形（アルファbbox）と平均色を取得する。
 * 平均色は各モードの配色（背景・帯・ロゴ色）を立ち絵に馴染ませるのに使う。
 * ------------------------------------------------------------------- */
function analyzeImage(img) {
  const S = 220; // 解析用の縮小サイズ
  const scale = Math.min(S / img.naturalWidth, S / img.naturalHeight, 1);
  const w = Math.max(1, Math.round(img.naturalWidth * scale));
  const h = Math.max(1, Math.round(img.naturalHeight * scale));
  const c = newCanvas(w, h);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data;

  let minX = w, minY = h, maxX = -1, maxY = -1;
  let transparent = 0, n = 0, sr = 0, sg = 0, sb = 0;
  // 色相ヒストグラム（36分割）で「支配的な色」を求める。最も彩度の高い
  // 1画素を拾うと小さな装飾に引きずられるため、面積で重み付けする。
  const BIN = 36;
  const hw = new Float64Array(BIN), hr = new Float64Array(BIN),
        hg = new Float64Array(BIN), hb = new Float64Array(BIN);

  for (let y = 0; y < h; y++) {
    for (let px = 0; px < w; px++) {
      const i = (y * w + px) * 4;
      const a = d[i + 3];
      if (a < 24) { transparent++; continue; }
      if (a > 200) {
        if (px < minX) minX = px; if (px > maxX) maxX = px;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
      const r = d[i], g = d[i + 1], b = d[i + 2];
      sr += r; sg += g; sb += b; n++;
      // 彩度が高く明るすぎない画素をアクセント色候補に
      const [hh, ss, ll] = rgbToHsl(r, g, b);
      if (ss > 0.14 && ll > 0.14 && ll < 0.9) {
        const bi = Math.min(BIN - 1, Math.floor(hh / 360 * BIN));
        const w = ss * (1 - Math.abs(ll - 0.5) * 0.9);
        hw[bi] += w; hr[bi] += r * w; hg[bi] += g * w; hb[bi] += b * w;
      }
    }
  }
  if (maxX < 0) { minX = 0; minY = 0; maxX = w - 1; maxY = h - 1; }
  const total = w * h;
  const avg = n ? [sr / n, sg / n, sb / n] : [180, 180, 180];
  let top = 0;
  for (let i = 1; i < BIN; i++) if (hw[i] > hw[top]) top = i;
  const accent = hw[top] > 0
    ? [hr[top] / hw[top], hg[top] / hw[top], hb[top] / hw[top]]
    : avg;

  return {
    hasAlpha: transparent / total > 0.06,   // 透過PNGとみなせるか
    // 元画像座標系に戻した被写体bbox
    bbox: {
      x: minX / w, y: minY / h,
      w: (maxX - minX + 1) / w, h: (maxY - minY + 1) / h
    },
    avg,
    accentHsl: rgbToHsl(accent[0], accent[1], accent[2])
  };
}

/* ---- 被写体の配置計算 --------------------------------------------------
 * アルファbboxを基準に「箱に収める」矩形を返す。
 * fit:'contain'（全身が入る） / 'cover'（箱を埋める）
 * anchorY: 0=上寄せ 0.5=中央 1=下寄せ（bbox基準）
 * scale / dx / dy: ユーザーによる微調整（dx,dyは箱のサイズに対する比率）
 * ------------------------------------------------------------------- */
function placeSubject(img, meta, box, opt) {
  opt = opt || {};
  const fit = opt.fit || 'contain';
  const ax = opt.anchorX === undefined ? 0.5 : opt.anchorX;
  const ay = opt.anchorY === undefined ? 1 : opt.anchorY;
  const bb = meta.bbox;
  const iw = img.naturalWidth, ih = img.naturalHeight;
  // 実効的な被写体サイズ（px）
  const sw = bb.w * iw, sh = bb.h * ih;
  const sx = Math.min(box.w / sw, box.h / sh);
  const cv = Math.max(box.w / sw, box.h / sh);
  const s = (fit === 'cover' ? cv : sx) * (opt.scale || 1);
  // bbox 左上が来るべき座標
  const dx = box.x + (box.w - sw * s) * ax - bb.x * iw * s + (opt.dx || 0) * box.w;
  const dy = box.y + (box.h - sh * s) * ay - bb.y * ih * s + (opt.dy || 0) * box.h;
  return { x: dx, y: dy, w: iw * s, h: ih * s, s,
           // bboxの実際の描画位置（テキスト回り込みなどに使う）
           bx: dx + bb.x * iw * s, by: dy + bb.y * ih * s, bw: sw * s, bh: sh * s };
}
function drawSubject(ctx, img, p) { ctx.drawImage(img, p.x, p.y, p.w, p.h); }

/* ユーザー調整（env.adj）を織り込んで配置を求める。全モードはこちらを使う */
function place(env, box, opt) {
  const a = (env && env.adj) || { scale: 1, dx: 0, dy: 0 };
  const o = Object.assign({}, opt);
  o.scale = (o.scale || 1) * a.scale;
  o.dx = (o.dx || 0) + a.dx;
  o.dy = (o.dy || 0) + a.dy;
  return placeSubject(env.img, env.meta, box, o);
}

/* =========================================================================
 * [2] WebGL2 コア（フィルタ用のオフスクリーン基盤）
 * ====================================================================== */

const GLX = (() => {
  let cv = null, gl = null, quad = null, failed = false;
  const progs = new Map();

  function ctx() {
    if (gl || failed) return gl;
    cv = newCanvas(8, 8);
    gl = cv.getContext('webgl2', {
      antialias: false, alpha: true, depth: true,
      premultipliedAlpha: false, preserveDrawingBuffer: true
    });
    if (!gl) { failed = true; return null; }
    gl.getExtension('EXT_color_buffer_float');
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    return gl;
  }

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(s);
      console.error(log, src);
      throw new Error('shader compile error: ' + log);
    }
    return s;
  }
  function program(key, vs, fs) {
    if (progs.has(key)) return progs.get(key);
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, 'a_pos');
    gl.bindAttribLocation(p, 1, 'a_uv');
    gl.bindAttribLocation(p, 2, 'a_nrm');
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    progs.set(key, p);
    return p;
  }

  let aniso;   // EXT_texture_filter_anisotropic（無ければ null）
  function texture(src, opt) {
    opt = opt || {};
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, opt.repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, opt.repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    if (opt.mip === false) {
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      return t;
    }
    // 奥の本や床のように大きく縮小される面は、ミップマップが無いと
    // 点サンプリングになってジャギー・ちらつきが出る
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.generateMipmap(gl.TEXTURE_2D);
    if (aniso === undefined) {
      aniso = gl.getExtension('EXT_texture_filter_anisotropic') || null;
      if (aniso) aniso.max = gl.getParameter(aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT);
    }
    if (aniso) gl.texParameterf(gl.TEXTURE_2D, aniso.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(8, aniso.max));
    return t;
  }

  function fbo(w, h, withDepth) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    let rb = null;
    if (withDepth) {
      rb = gl.createRenderbuffer();
      gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
      gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, w, h);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, rb);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { tex: t, fb: f, rb, w, h };
  }

  /* uniform をまとめて設定。テクスチャは {tex:...} 形式で渡す */
  function setUniforms(p, u) {
    let unit = 0;
    for (const k in u) {
      const loc = gl.getUniformLocation(p, k);
      if (loc === null) continue;
      const v = u[k];
      if (v === undefined || v === null) continue;
      if (v && v.tex !== undefined && v.fb === undefined && typeof v.tex !== 'number') {
        gl.activeTexture(gl.TEXTURE0 + unit);
        gl.bindTexture(gl.TEXTURE_2D, v.tex);
        gl.uniform1i(loc, unit); unit++;
      } else if (v instanceof Float32Array || Array.isArray(v)) {
        if (v.length === 16) gl.uniformMatrix4fv(loc, false, v);
        else if (v.length === 4) gl.uniform4fv(loc, v);
        else if (v.length === 3) gl.uniform3fv(loc, v);
        else if (v.length === 2) gl.uniform2fv(loc, v);
        else gl.uniform1fv(loc, v);
      } else if (typeof v === 'boolean') {
        gl.uniform1i(loc, v ? 1 : 0);
      } else if (Number.isInteger(v) && Math.abs(v) < 1e6 && k.startsWith('i_')) {
        gl.uniform1i(loc, v);
      } else {
        gl.uniform1f(loc, v);
      }
    }
  }

  /* フルスクリーン1パス */
  function pass(prog, uniforms, target) {
    const w = target ? target.w : cv.width, h = target ? target.h : cv.height;
    gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
    gl.viewport(0, 0, w, h);
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.BLEND);
    gl.useProgram(prog);
    setUniforms(prog, Object.assign({ u_res: [w, h] }, uniforms));
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.disableVertexAttribArray(1);
    gl.disableVertexAttribArray(2);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function resize(w, h) { cv.width = w; cv.height = h; }
  function dispose(list) {
    for (const o of list) {
      if (!o) continue;
      if (o.fb) { gl.deleteFramebuffer(o.fb); gl.deleteTexture(o.tex); if (o.rb) gl.deleteRenderbuffer(o.rb); }
      else gl.deleteTexture(o);
    }
  }

  return {
    get gl() { return ctx(); },
    get canvas() { return cv; },
    available() { return !!ctx(); },
    program, texture, fbo, pass, resize, dispose, setUniforms
  };
})();

/* 頂点シェーダ（フルスクリーン三角形） */
const VS_FULL = `#version 300 es
in vec2 a_pos;
out vec2 v_uv;
void main(){ v_uv = a_pos * 0.5 + 0.5; gl_Position = vec4(a_pos, 0.0, 1.0); }`;

const FS_HEAD = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 v_uv;
out vec4 fragColor;
uniform vec2 u_res;
`;

/* =========================================================================
 * [3] フラグメントシェーダ群
 * ====================================================================== */

/* 共通のノイズ関数 */
const GLSL_NOISE = `
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(hash12(i), hash12(i+vec2(1,0)), f.x),
             mix(hash12(i+vec2(0,1)), hash12(i+vec2(1,1)), f.x), f.y);
}
float fbm(vec2 p){ float v=0.0, a=0.5; for(int i=0;i<5;i++){ v += a*vnoise(p); p *= 2.03; a *= 0.5; } return v; }
float luma(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }
`;

/* --- 構造テンソル（Sobel）: 局所的な模様の方向を推定する第1段 --- */
const FS_TENSOR = FS_HEAD + `
uniform sampler2D u_tex;
void main(){
  vec2 px = 1.0 / u_res;
  vec3 t00 = texture(u_tex, v_uv + px*vec2(-1,-1)).rgb;
  vec3 t10 = texture(u_tex, v_uv + px*vec2( 0,-1)).rgb;
  vec3 t20 = texture(u_tex, v_uv + px*vec2( 1,-1)).rgb;
  vec3 t01 = texture(u_tex, v_uv + px*vec2(-1, 0)).rgb;
  vec3 t21 = texture(u_tex, v_uv + px*vec2( 1, 0)).rgb;
  vec3 t02 = texture(u_tex, v_uv + px*vec2(-1, 1)).rgb;
  vec3 t12 = texture(u_tex, v_uv + px*vec2( 0, 1)).rgb;
  vec3 t22 = texture(u_tex, v_uv + px*vec2( 1, 1)).rgb;
  vec3 gx = (t00 + 2.0*t01 + t02 - t20 - 2.0*t21 - t22) * 0.25;
  vec3 gy = (t00 + 2.0*t10 + t20 - t02 - 2.0*t12 - t22) * 0.25;
  // E,G は [0,1]、F は [-1,1] に収まるよう正規化して RGBA8 に格納
  float E = clamp(dot(gx, gx) / 3.0, 0.0, 1.0);
  float G = clamp(dot(gy, gy) / 3.0, 0.0, 1.0);
  float F = clamp(dot(gx, gy) / 3.0, -1.0, 1.0);
  fragColor = vec4(E, F * 0.5 + 0.5, G, 1.0);
}`;

/* --- 分離ガウスぼかし --- */
const FS_BLUR = FS_HEAD + `
uniform sampler2D u_tex;
uniform vec2 u_dir;      // (1,0) or (0,1)
uniform float u_radius;  // px
void main(){
  vec2 px = 1.0 / u_res;
  float sigma = max(u_radius * 0.5, 0.5);
  vec4 sum = vec4(0.0); float wsum = 0.0;
  for (int i = -12; i <= 12; i++){
    float fi = float(i);
    if (abs(fi) > u_radius) continue;
    float w = exp(-(fi*fi) / (2.0*sigma*sigma));
    sum += texture(u_tex, v_uv + u_dir * px * fi) * w;
    wsum += w;
  }
  fragColor = sum / wsum;
}`;

/* --- 異方性 Kuwahara フィルタ（8セクタ / 楕円サンプリング） -------------
 * 構造テンソルから局所方向 φ と異方性 A を求め、方向に沿って伸ばした楕円を
 * 8セクタに分割。各セクタの平均色と分散を求め、分散が小さいセクタを重く
 * 採用することで、輪郭を保ったまま絵画的な塗りに変換する。
 * ------------------------------------------------------------------- */
const FS_AKF = FS_HEAD + GLSL_NOISE + `
uniform sampler2D u_tex;
uniform sampler2D u_tensor;
uniform float u_radius;     // 基準半径(px)
uniform float u_sharpness;  // 大きいほどエッジが立つ
const float PI = 3.14159265;
void main(){
  vec2 px = 1.0 / u_res;
  vec4 t = texture(u_tensor, v_uv);
  float E = t.r, F = t.g * 2.0 - 1.0, G = t.b;
  float disc = sqrt(max(0.0, (E-G)*(E-G) + 4.0*F*F));
  float l1 = 0.5 * (E + G + disc);
  float l2 = 0.5 * (E + G - disc);
  float A  = (l1 + l2) > 1e-6 ? (l1 - l2) / (l1 + l2) : 0.0;
  vec2 tang = vec2(l1 - E, -F);                 // 局所的な模様の接線方向
  float phi = length(tang) > 1e-6 ? atan(tang.y, tang.x) : 0.0;
  float ca = cos(phi), sa = sin(phi);

  float a = u_radius * clamp((1.0 + A) / 1.0, 0.4, 1.7);   // 接線方向に伸ばす
  float b = u_radius * clamp(1.0 / (1.0 + A), 0.4, 1.7);
  int R = int(ceil(max(a, b)));

  vec3 m[8]; vec3 s2[8]; float wt[8];
  for (int k = 0; k < 8; k++){ m[k] = vec3(0.0); s2[k] = vec3(0.0); wt[k] = 0.0; }

  for (int y = -10; y <= 10; y++){
    if (abs(y) > R) continue;
    for (int x = -10; x <= 10; x++){
      if (abs(x) > R) continue;
      vec2 off = vec2(float(x), float(y));
      // 楕円ローカル座標へ（-φ 回転して軸長で正規化）
      vec2 q = vec2(off.x*ca + off.y*sa, -off.x*sa + off.y*ca) / vec2(a, b);
      float d2 = dot(q, q);
      if (d2 > 1.0) continue;
      vec3 c = texture(u_tex, v_uv + off * px).rgb;
      float gw = exp(-2.2 * d2);
      float ang = atan(q.y, q.x);
      for (int k = 0; k < 8; k++){
        float cw = cos(ang - float(k) * PI * 0.25);
        float w = gw * pow(max(cw, 0.0), 6.0);
        m[k]  += c * w;
        s2[k] += c * c * w;
        wt[k] += w;
      }
    }
  }
  vec3 res = vec3(0.0); float total = 0.0;
  for (int k = 0; k < 8; k++){
    if (wt[k] < 1e-5) continue;
    vec3 mean = m[k] / wt[k];
    vec3 var  = abs(s2[k] / wt[k] - mean * mean);
    float sigma = sqrt(dot(var, vec3(0.299, 0.587, 0.114)));
    float w = 1.0 / (1.0 + pow(clamp(sigma, 0.0, 1.0) * 40.0, u_sharpness));
    res += mean * w; total += w;
  }
  fragColor = vec4(res / max(total, 1e-5), 1.0);
}`;

/* --- 水彩の「にじみ」: 輝度は保持し色差(Cb/Cr)だけぼかす --- */
const FS_CHROMA = FS_HEAD + `
uniform sampler2D u_sharp;
uniform sampler2D u_blur;
uniform float u_amount;
vec3 toYcc(vec3 c){
  return vec3(dot(c, vec3(0.299,0.587,0.114)),
              -0.168736*c.r - 0.331264*c.g + 0.5*c.b,
               0.5*c.r - 0.418688*c.g - 0.081312*c.b);
}
vec3 toRgb(vec3 y){
  return vec3(y.x + 1.402*y.z, y.x - 0.344136*y.y - 0.714136*y.z, y.x + 1.772*y.y);
}
void main(){
  vec3 s = toYcc(texture(u_sharp, v_uv).rgb);
  vec3 b = toYcc(texture(u_blur,  v_uv).rgb);
  vec3 o = vec3(s.x, mix(s.y, b.y, u_amount), mix(s.z, b.z, u_amount));
  fragColor = vec4(clamp(toRgb(o), 0.0, 1.0), 1.0);
}`;

/* --- 紙・キャンバス質感を multiply で薄く重ねる + 周辺減光 --- */
const FS_PAPER = FS_HEAD + GLSL_NOISE + `
uniform sampler2D u_tex;
uniform float u_amount;     // 質感の強さ
uniform float u_scale;      // 目の細かさ
uniform float u_vignette;
uniform float u_sat, u_con;
uniform vec3  u_tint;       // 紙の色味
void main(){
  vec3 c = texture(u_tex, v_uv).rgb;
  // 絵画化で眠くなった彩度・コントラストを少し戻す
  c = clamp(mix(vec3(luma(c)), c, u_sat), 0.0, 1.0);
  c = clamp((c - 0.5) * u_con + 0.5, 0.0, 1.0);
  vec2 p = v_uv * u_scale;
  // キャンバス地の織り目 + 紙の繊維
  float weave = (sin(p.x * 3.0) * sin(p.y * 3.0)) * 0.5 + 0.5;
  float fiber = fbm(p * 0.35);
  float grain = hash12(floor(v_uv * u_res * 0.75));
  float tex = mix(weave, fiber, 0.72) * 0.75 + grain * 0.25;
  c *= mix(vec3(1.0), u_tint * (0.72 + tex * 0.5), u_amount);
  // 端に向かって色を沈ませる（水彩紙のにじみ止め風）
  float d = length(v_uv - 0.5) * 1.42;
  c *= 1.0 - smoothstep(0.55, 1.15, d) * u_vignette;
  fragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
}`;

/* --- 劇画調（ポスタライズ + インク輪郭 + 網点 + グレイン + デュオトーン） --- */
const FS_GEKIGA = FS_HEAD + GLSL_NOISE + `
uniform sampler2D u_tex;
uniform float u_levels;      // 階調数 4〜6
uniform float u_edge;        // 輪郭線の強さ
uniform float u_dot;         // 網点のピッチ(px)
uniform float u_grain;
uniform float u_duotone;     // 0=モノクロ 1=デュオトーン
uniform vec3  u_dark;
uniform vec3  u_light;
uniform vec3  u_accent;
float lumAt(vec2 uv){ return luma(texture(u_tex, uv).rgb); }
void main(){
  vec2 px = 1.0 / u_res;
  vec3 src = texture(u_tex, v_uv).rgb;
  float l = luma(src);

  // 1) ハイコントラスト化 → 輝度ポスタライズ
  float hc = clamp((l - 0.5) * 1.55 + 0.5, 0.0, 1.0);
  float q  = floor(hc * u_levels) / max(u_levels - 1.0, 1.0);
  q = clamp(q, 0.0, 1.0);

  // 2) Sobel エッジ → 二値化した黒線
  float gx = lumAt(v_uv+px*vec2(-1,-1)) + 2.0*lumAt(v_uv+px*vec2(-1,0)) + lumAt(v_uv+px*vec2(-1,1))
           - lumAt(v_uv+px*vec2( 1,-1)) - 2.0*lumAt(v_uv+px*vec2( 1,0)) - lumAt(v_uv+px*vec2( 1,1));
  float gy = lumAt(v_uv+px*vec2(-1,-1)) + 2.0*lumAt(v_uv+px*vec2(0,-1)) + lumAt(v_uv+px*vec2(1,-1))
           - lumAt(v_uv+px*vec2(-1, 1)) - 2.0*lumAt(v_uv+px*vec2(0, 1)) - lumAt(v_uv+px*vec2(1, 1));
  float edge = smoothstep(0.16, 0.42, length(vec2(gx, gy)));

  // 3) 影の領域にハーフトーン網点（30度回転した格子）
  float ang = 0.5236;
  vec2 rp = vec2(v_uv.x*u_res.x*cos(ang) - v_uv.y*u_res.y*sin(ang),
                 v_uv.x*u_res.x*sin(ang) + v_uv.y*u_res.y*cos(ang));
  vec2 cell = mod(rp, u_dot) - u_dot * 0.5;
  float shade = smoothstep(0.62, 0.16, q);                 // 暗い所ほど1
  float radius = u_dot * 0.52 * sqrt(clamp(shade, 0.0, 1.0));
  float dot_ = 1.0 - smoothstep(radius - 0.9, radius + 0.9, length(cell));
  float halftone = 1.0 - dot_ * 0.85 * step(0.02, shade);

  // 4) 合成
  float ink = clamp(q * halftone * (1.0 - edge * u_edge), 0.0, 1.0);
  float g = hash12(v_uv * u_res + 17.0);
  ink = clamp(ink + (g - 0.5) * u_grain, 0.0, 1.0);

  vec3 mono = mix(u_dark, u_light, ink);
  vec3 duo  = mix(mix(u_dark, u_accent, smoothstep(0.05, 0.62, ink)),
                  u_light, smoothstep(0.62, 1.0, ink));
  fragColor = vec4(mix(mono, duo, u_duotone), 1.0);
}`;

/* --- 新聞の網点写真（粗いグレースケール網点 + 紙の地） --- */
const FS_NEWSPRINT = FS_HEAD + GLSL_NOISE + `
uniform sampler2D u_tex;
uniform float u_dot;
uniform vec3 u_paper;
uniform vec3 u_ink;
void main(){
  vec3 src = texture(u_tex, v_uv).rgb;
  float l = clamp((luma(src) - 0.5) * 1.28 + 0.52, 0.0, 1.0);
  float ang = 0.7854;
  vec2 p = v_uv * u_res;
  vec2 rp = vec2(p.x*cos(ang) - p.y*sin(ang), p.x*sin(ang) + p.y*cos(ang));
  vec2 cell = mod(rp, u_dot) - u_dot * 0.5;
  float radius = u_dot * 0.58 * sqrt(clamp(1.0 - l, 0.0, 1.0));
  float d = 1.0 - smoothstep(radius - 0.7, radius + 0.7, length(cell));
  float ink = clamp(d + (1.0 - l) * 0.18, 0.0, 1.0);
  // インクのかすれ
  ink *= 0.86 + 0.14 * hash12(floor(p * 0.5));
  fragColor = vec4(mix(u_paper, u_ink, ink), 1.0);
}`;

/* --- 2枚を一定比率で混ぜる（水彩の軟化に使用） --- */
const FS_MIX = FS_HEAD + `
uniform sampler2D u_a;
uniform sampler2D u_b;
uniform float u_amount;
void main(){
  fragColor = vec4(mix(texture(u_a, v_uv).rgb, texture(u_b, v_uv).rgb, u_amount), 1.0);
}`;

/* --- 被写界深度合成（CoCマスクで sharp と blur を混ぜる） --- */
const FS_DOF = FS_HEAD + `
uniform sampler2D u_sharp;
uniform sampler2D u_blur;
uniform sampler2D u_coc;
void main(){
  float coc = texture(u_coc, v_uv).r;
  fragColor = vec4(mix(texture(u_sharp, v_uv).rgb, texture(u_blur, v_uv).rgb, clamp(coc,0.0,1.0)), 1.0);
}`;

/* =========================================================================
 * [4] フィルタ（WebGL2 マルチパス）
 * ====================================================================== */

/* GL でパスを組み立て、結果を 2D キャンバスとして返す共通ラッパ */
function glRun(w, h, build) {
  const gl = GLX.gl;
  if (!gl) return null;
  GLX.resize(w, h);
  const trash = [];
  try {
    build(gl, trash);
  } catch (e) {
    console.error(e);
    GLX.dispose(trash);
    return null;
  }
  const out = newCanvas(w, h);
  out.getContext('2d').drawImage(GLX.canvas, 0, 0);
  GLX.dispose(trash);
  return out;
}

/* --- 水彩風（RPGモード用） ---------------------------------------------
 * Sobel構造テンソル → テンソル平滑化 → 異方性Kuwahara → 色差ぼかし →
 * 全体の軟化 → 紙質multiply、の5段パイプライン。
 * ------------------------------------------------------------------- */
function fxWatercolor(src, opt) {
  opt = opt || {};
  const RW = opt.w || opt.res || 760, RH = opt.h || opt.res || 760;
  return glRun(RW, RH, (gl, trash) => {
    const pTensor = GLX.program('tensor', VS_FULL, FS_TENSOR);
    const pBlur = GLX.program('blur', VS_FULL, FS_BLUR);
    const pAkf = GLX.program('akf', VS_FULL, FS_AKF);
    const pChroma = GLX.program('chroma', VS_FULL, FS_CHROMA);
    const pMix = GLX.program('mix', VS_FULL, FS_MIX);
    const pPaper = GLX.program('paper', VS_FULL, FS_PAPER);

    const tex = GLX.texture(src); trash.push(tex);
    const A = GLX.fbo(RW, RH), B = GLX.fbo(RW, RH), C = GLX.fbo(RW, RH),
          D = GLX.fbo(RW, RH), E = GLX.fbo(RW, RH), F = GLX.fbo(RW, RH);
    trash.push(A, B, C, D, E, F);

    // 1) 構造テンソル → 2パスぼかしで方向場を安定させる
    GLX.pass(pTensor, { u_tex: { tex } }, A);
    GLX.pass(pBlur, { u_tex: { tex: A.tex }, u_dir: [1, 0], u_radius: 4 }, B);
    GLX.pass(pBlur, { u_tex: { tex: B.tex }, u_dir: [0, 1], u_radius: 4 }, C);

    // 2) 異方性Kuwahara（絵画的な塗り）
    GLX.pass(pAkf, {
      u_tex: { tex }, u_tensor: { tex: C.tex },
      u_radius: opt.radius === undefined ? 4.0 : opt.radius,
      u_sharpness: opt.sharpness === undefined ? 7.0 : opt.sharpness
    }, D);

    // 3) 色差を大きくぼかして「にじみ」を作る
    GLX.pass(pBlur, { u_tex: { tex: D.tex }, u_dir: [1, 0], u_radius: 11 }, A);
    GLX.pass(pBlur, { u_tex: { tex: A.tex }, u_dir: [0, 1], u_radius: 11 }, B);
    GLX.pass(pChroma, { u_sharp: { tex: D.tex }, u_blur: { tex: B.tex }, u_amount: 0.85 }, E);

    // 4) 全体を軽くぼかして混ぜ、絵の具が紙に染みたような軟らかい輪郭にする
    GLX.pass(pBlur, { u_tex: { tex: E.tex }, u_dir: [1, 0], u_radius: 5 }, A);
    GLX.pass(pBlur, { u_tex: { tex: A.tex }, u_dir: [0, 1], u_radius: 5 }, B);
    GLX.pass(pMix, {
      u_a: { tex: E.tex }, u_b: { tex: B.tex },
      u_amount: opt.soften === undefined ? 0.55 : opt.soften
    }, F);

    // 5) 紙質を multiply
    GLX.pass(pPaper, {
      u_tex: { tex: F.tex }, u_amount: 0.50, u_scale: 620.0,
      u_vignette: 0.30, u_sat: 1.45, u_con: 1.08, u_tint: [1.0, 0.975, 0.925]
    }, null);
  });
}

/* --- 劇画調（映画ポスター用） ------------------------------------------
 * 軽いKuwaharaで面を整えてから、ポスタライズ／輪郭線／網点／グレイン／
 * デュオトーンを1パスで重ねる。
 * ------------------------------------------------------------------- */
function fxGekiga(src, opt) {
  opt = opt || {};
  const RW = opt.w || opt.res || 900, RH = opt.h || opt.res || 900;
  return glRun(RW, RH, (gl, trash) => {
    const pTensor = GLX.program('tensor', VS_FULL, FS_TENSOR);
    const pBlur = GLX.program('blur', VS_FULL, FS_BLUR);
    const pAkf = GLX.program('akf', VS_FULL, FS_AKF);
    const pGek = GLX.program('gekiga', VS_FULL, FS_GEKIGA);

    const tex = GLX.texture(src); trash.push(tex);
    const A = GLX.fbo(RW, RH), B = GLX.fbo(RW, RH), C = GLX.fbo(RW, RH), D = GLX.fbo(RW, RH);
    trash.push(A, B, C, D);

    GLX.pass(pTensor, { u_tex: { tex } }, A);
    GLX.pass(pBlur, { u_tex: { tex: A.tex }, u_dir: [1, 0], u_radius: 3 }, B);
    GLX.pass(pBlur, { u_tex: { tex: B.tex }, u_dir: [0, 1], u_radius: 3 }, C);
    GLX.pass(pAkf, { u_tex: { tex }, u_tensor: { tex: C.tex }, u_radius: 3.0, u_sharpness: 6.0 }, D);

    GLX.pass(pGek, {
      u_tex: { tex: D.tex },
      u_levels: opt.levels || 5.0,
      u_edge: opt.edge === undefined ? 0.92 : opt.edge,
      u_dot: opt.dot || 5.0,
      u_grain: opt.grain === undefined ? 0.075 : opt.grain,
      u_duotone: opt.duotone === undefined ? 1.0 : opt.duotone,
      u_dark: opt.dark || [0.055, 0.05, 0.06],
      u_light: opt.light || [0.94, 0.925, 0.90],
      u_accent: opt.accent || [0.72, 0.16, 0.13]
    }, null);
  });
}

/* --- 新聞の網点写真 --- */
function fxNewsprint(src, w, h, opt) {
  opt = opt || {};
  return glRun(w, h, (gl, trash) => {
    const p = GLX.program('newsprint', VS_FULL, FS_NEWSPRINT);
    const tex = GLX.texture(src); trash.push(tex);
    GLX.pass(p, {
      u_tex: { tex }, u_dot: opt.dot || 4.6,
      u_paper: opt.paper || [0.945, 0.930, 0.895],
      u_ink: opt.ink || [0.10, 0.10, 0.11]
    }, null);
  });
}

/* =========================================================================
 * [5] 描画プリミティブ（Canvas2D）
 * ====================================================================== */

const FONT = {
  logo: '"Anton","Noto Sans JP",sans-serif',            // 雑誌ロゴ（英字想定）
  fantasy: '"Cinzel","EB Garamond","Times New Roman","Noto Serif JP",serif', // RPGロゴ（英字想定）
  cond: '"Oswald","Noto Sans JP",sans-serif',           // コンデンス系（欧文小見出し）
  sans: '"Noto Sans JP",sans-serif',
  serif: '"Noto Serif JP",serif',
  poster: '"Anton","Noto Serif JP",serif'      // 映画ポスターのタイトル（欧文はAnton）
};

function f(weight, size, family) { return `${weight} ${size}px ${family}`; }

/* 指定幅に収まる最大フォントサイズを二分探索で求める */
function fitSize(ctx, text, weight, family, maxW, maxSize, minSize, tracking) {
  tracking = tracking || 0;
  let lo = minSize || 8, hi = maxSize, best = lo;
  for (let i = 0; i < 22; i++) {
    const mid = (lo + hi) / 2;
    ctx.font = f(weight, mid, family);
    const w = ctx.measureText(text).width + tracking * mid * Math.max(0, text.length - 1);
    if (w <= maxW) { best = mid; lo = mid; } else { hi = mid; }
  }
  return best;
}

/* 字送り（letter-spacing）付きテキスト描画。align: left|center|right */
function drawTracked(ctx, text, x, y, tracking, align, mode) {
  const chars = Array.from(text);
  const sp = tracking;
  let total = 0;
  const ws = chars.map(c => { const w = ctx.measureText(c).width; total += w; return w; });
  total += sp * Math.max(0, chars.length - 1);
  let cx = align === 'center' ? x - total / 2 : (align === 'right' ? x - total : x);
  const prev = ctx.textAlign;
  ctx.textAlign = 'left';
  for (let i = 0; i < chars.length; i++) {
    if (mode === 'stroke') ctx.strokeText(chars[i], cx, y);
    else if (mode === 'both') { ctx.strokeText(chars[i], cx, y); ctx.fillText(chars[i], cx, y); }
    else ctx.fillText(chars[i], cx, y);
    cx += ws[i] + sp;
  }
  ctx.textAlign = prev;
  return total;
}
function trackedWidth(ctx, text, tracking) {
  const chars = Array.from(text);
  let t = 0; for (const c of chars) t += ctx.measureText(c).width;
  return t + tracking * Math.max(0, chars.length - 1);
}

/* 日本語込みの折り返し（簡易禁則つき）。ASCII単語は分割しない */
const NO_LINE_START = '、。，．・：；？！ーぁぃぅぇぉっゃゅょゎ々〉」』】）］｝〕”’,.!?)]}';
const NO_LINE_END = '（［｛〔「『【〈“‘([{';
function tokenize(text) {
  const out = [];
  let buf = '';
  for (const ch of Array.from(text)) {
    if (/[A-Za-z0-9'’.\-]/.test(ch)) { buf += ch; }
    else { if (buf) { out.push(buf); buf = ''; } out.push(ch); }
  }
  if (buf) out.push(buf);
  return out;
}
function wrapText(ctx, text, maxW, tracking) {
  tracking = tracking || 0;
  const paragraphs = String(text).split('\n');
  const lines = [];
  for (const para of paragraphs) {
    if (para === '') { lines.push(''); continue; }
    const toks = tokenize(para);
    let line = '';
    for (let i = 0; i < toks.length; i++) {
      const t = toks[i];
      const test = line + t;
      if (line && trackedWidth(ctx, test, tracking) > maxW) {
        // 行頭禁則: 句読点や閉じ括弧が行頭に来ないよう、直前の1文字ごと次行へ送る
        // （ぶら下げると枠からはみ出すため追い出しで処理する）
        if (NO_LINE_START.indexOf(t) >= 0 && t.length === 1) {
          const arr = Array.from(line);
          if (arr.length > 1) { lines.push(arr.slice(0, -1).join('')); line = arr[arr.length - 1] + t; }
          else { lines.push(line); line = t; }
          continue;
        }
        // 行末禁則: 行末が開き括弧なら次行へ送る
        if (NO_LINE_END.indexOf(line[line.length - 1]) >= 0) {
          const last = line[line.length - 1];
          lines.push(line.slice(0, -1));
          line = last + t;
        } else { lines.push(line); line = t; }
      } else line = test;
    }
    if (line) lines.push(line);
  }
  return lines;
}
/* 折り返した結果が maxLines・maxH に収まるフォントサイズを探す */
function fitBlock(ctx, text, weight, family, maxW, maxH, maxSize, lineH, tracking) {
  let size = maxSize;
  for (let i = 0; i < 40; i++) {
    ctx.font = f(weight, size, family);
    const lines = wrapText(ctx, text, maxW, tracking * size);
    if (lines.length * size * lineH <= maxH) return { size, lines };
    size *= 0.94;
    if (size < 9) break;
  }
  ctx.font = f(weight, size, family);
  return { size, lines: wrapText(ctx, text, maxW, tracking * size) };
}

/* 縦書き（新聞・書籍表紙用）。約物は回転させて縦組みらしく見せる */
const VROT = 'ー〜（）「」『』【】〔〕［］｛｝〈〉…‥―－:;=～';
const VSHIFT = '、。，．';
function drawVertical(ctx, text, x, y, size, lineH) {
  const chars = Array.from(text);
  let cy = y;
  for (const ch of chars) {
    if (ch === '\n') continue;
    ctx.save();
    if (VROT.indexOf(ch) >= 0) {
      ctx.translate(x, cy + size * 0.35);
      ctx.rotate(Math.PI / 2);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(ch, 0, 0);
    } else if (VSHIFT.indexOf(ch) >= 0) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(ch, x + size * 0.34, cy + size * 0.20);
    } else {
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(ch, x, cy + size * 0.82);
    }
    ctx.restore();
    cy += size * lineH;
  }
  return cy;
}
/* 縦書きを列に分けて流し込む（右から左へ） */
function drawVerticalBlock(ctx, text, right, top, size, lineH, maxH, colGap) {
  const perCol = Math.max(1, Math.floor(maxH / (size * lineH)));
  const chars = Array.from(String(text).replace(/\n/g, ''));
  let x = right, i = 0, cols = 0;
  while (i < chars.length) {
    let take = chars.slice(i, i + perCol);
    // 行頭禁則
    if (i + perCol < chars.length && NO_LINE_START.indexOf(chars[i + perCol]) >= 0) take.push(chars[i + perCol]);
    drawVertical(ctx, take.join(''), x, top, size, lineH);
    i += take.length; x -= size * colGap; cols++;
    if (cols > 12) break;
  }
  return x;
}

function roundRect(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

/* バーコード風装飾（ダミー） */
function drawBarcode(ctx, x, y, w, h, seed, label) {
  const r = rnd(seed);
  ctx.save();
  ctx.fillStyle = '#fff';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#111';
  let cx = x + w * 0.05;
  const bh = h * 0.72, top = y + h * 0.06;
  const lim = x + w * 0.95;
  while (cx < lim) {
    const bw = 1 + Math.floor(r() * 4);
    if (r() > 0.32) ctx.fillRect(cx, top, Math.min(bw, lim - cx), bh);
    cx += bw + 1 + Math.floor(r() * 3);
  }
  ctx.font = f(600, h * 0.17, FONT.cond);
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText(label || '4 912345 678904', x + w / 2, top + bh + h * 0.03);
  ctx.restore();
}

/* 紙のグレイン（2D側の仕上げ） */
function drawGrain(ctx, w, h, amount, seed, size) {
  const s = size || 3;
  const gw = Math.ceil(w / s), gh = Math.ceil(h / s);
  const c = newCanvas(gw, gh);
  const g = c.getContext('2d');
  const id = g.createImageData(gw, gh);
  const r = rnd(seed || 7);
  for (let i = 0; i < gw * gh; i++) {
    const v = 128 + (r() - 0.5) * 255;
    id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v;
    id.data[i * 4 + 3] = 255;
  }
  g.putImageData(id, 0, 0);
  ctx.save();
  ctx.globalAlpha = amount;
  ctx.globalCompositeOperation = 'overlay';
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(c, 0, 0, w, h);
  ctx.restore();
}

/* ビネット */
function drawVignette(ctx, w, h, strength, color) {
  const g = ctx.createRadialGradient(w / 2, h * 0.46, w * 0.22, w / 2, h * 0.5, w * 0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, color || `rgba(0,0,0,${strength})`);
  ctx.save();
  ctx.globalAlpha = color ? strength : 1;
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  ctx.restore();
}

/* =========================================================================
 * [6] 擬似3Dステージ
 *   各モードは「1枚の絵」を作り、それを日常の風景に置いた1コマとして
 *   透視投影でレンダリングする。レイヤーの重ね合わせでは出せない
 *   遠近・被写界深度・陰影を、この共通基盤で担当する。
 * ====================================================================== */

/* --- 4x4行列（列優先 / GLSLと同じ並び） --- */
const M4 = {
  mul(a, b) {
    const o = new Float32Array(16);
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
      let s = 0;
      for (let k = 0; k < 4; k++) s += a[r + k * 4] * b[k + c * 4];
      o[r + c * 4] = s;
    }
    return o;
  },
  perspective(fovyDeg, aspect, near, far) {
    const fo = 1 / Math.tan(fovyDeg * Math.PI / 360);
    const nf = 1 / (near - far);
    const o = new Float32Array(16);
    o[0] = fo / aspect; o[5] = fo; o[10] = (far + near) * nf; o[11] = -1; o[14] = 2 * far * near * nf;
    return o;
  },
  lookAt(eye, at, up) {
    const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
    const norm = (v) => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
    const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    const z = norm(sub(eye, at)), x = norm(cross(up, z)), y = cross(z, x);
    return new Float32Array([
      x[0], y[0], z[0], 0,
      x[1], y[1], z[1], 0,
      x[2], y[2], z[2], 0,
      -dot(x, eye), -dot(y, eye), -dot(z, eye), 1
    ]);
  },
  /* 位置 / 回転(度 XYZ) / 大きさ からモデル行列を作る（T * Ry * Rx * Rz * S） */
  compose(pos, rot, size) {
    const d = Math.PI / 180;
    const cx = Math.cos((rot[0] || 0) * d), sx = Math.sin((rot[0] || 0) * d);
    const cy = Math.cos((rot[1] || 0) * d), sy = Math.sin((rot[1] || 0) * d);
    const cz = Math.cos((rot[2] || 0) * d), sz = Math.sin((rot[2] || 0) * d);
    const R = [
      [cy * cz + sy * sx * sz, -cy * sz + sy * sx * cz, sy * cx],
      [cx * sz, cx * cz, -sx],
      [-sy * cz + cy * sx * sz, sy * sz + cy * sx * cz, cy * cx]
    ];
    const o = new Float32Array(16);
    for (let c = 0; c < 3; c++) for (let r = 0; r < 3; r++) o[r + c * 4] = R[r][c] * size[c];
    o[12] = pos[0]; o[13] = pos[1]; o[14] = pos[2]; o[15] = 1;
    return o;
  }
};

const VS_STAGE = `#version 300 es
in vec3 a_pos; in vec2 a_uv; in vec3 a_nrm;
uniform mat4 u_mvp, u_model, u_view;
uniform vec2 u_uvScale;
out vec2 v_uv; out vec3 v_nrm; out float v_viewZ;
void main(){
  vec4 wp = u_model * vec4(a_pos, 1.0);
  v_viewZ = -(u_view * wp).z;
  v_nrm = mat3(u_model) * a_nrm;
  v_uv = a_uv * u_uvScale;
  gl_Position = u_mvp * vec4(a_pos, 1.0);
}`;

const FS_STAGE = `#version 300 es
precision highp float;
in vec2 v_uv; in vec3 v_nrm; in float v_viewZ;
out vec4 fragColor;
uniform sampler2D u_tex;
uniform vec3 u_color, u_light;
uniform float u_useTex, u_unlit, u_alpha, u_mode, u_focus, u_dofScale, u_ambient;
void main(){
  if (u_mode > 0.5){                                  // CoC（被写界深度マスク）
    float coc = clamp(abs(v_viewZ - u_focus) * u_dofScale, 0.0, 1.0);
    fragColor = vec4(coc, coc, coc, 1.0); return;
  }
  vec4 base = u_useTex > 0.5 ? texture(u_tex, v_uv) : vec4(u_color, 1.0);
  if (base.a < 0.004) discard;
  float sh = 1.0;
  if (u_unlit < 0.5){
    vec3 n = normalize(v_nrm);
    vec3 l = normalize(u_light);
    sh = u_ambient + (1.0 - u_ambient) * max(dot(n, l), 0.0);
    sh += 0.06 * max(n.y, 0.0);
  }
  fragColor = vec4(base.rgb * sh, base.a * u_alpha);
}`;

/* 単位立方体（-0.5〜0.5）。面ごとに6頂点、順は TOP/BOTTOM/FRONT/BACK/RIGHT/LEFT。
 * 各面のUVは、その面を正面から見たときに絵が正立するよう割り当てている。 */
const BOX_GEOMETRY = (() => {
  const v = [];
  const quad = (pts, n, uvs) => {
    const idx = [0, 1, 2, 0, 2, 3];
    for (const i of idx) v.push(pts[i][0], pts[i][1], pts[i][2], uvs[i][0], uvs[i][1], n[0], n[1], n[2]);
  };
  const U = [[0, 0], [1, 0], [1, 1], [0, 1]];
  const h = 0.5;
  quad([[-h, h, h], [h, h, h], [h, h, -h], [-h, h, -h]], [0, 1, 0], U);      // TOP   (奥=上)
  quad([[-h, -h, -h], [h, -h, -h], [h, -h, h], [-h, -h, h]], [0, -1, 0], U); // BOTTOM
  quad([[-h, -h, h], [h, -h, h], [h, h, h], [-h, h, h]], [0, 0, 1], U);      // FRONT (上=上)
  quad([[h, -h, -h], [-h, -h, -h], [-h, h, -h], [h, h, -h]], [0, 0, -1], U); // BACK
  quad([[h, -h, h], [h, -h, -h], [h, h, -h], [h, h, h]], [1, 0, 0], U);      // RIGHT
  quad([[-h, -h, -h], [-h, -h, h], [-h, h, h], [-h, h, -h]], [-1, 0, 0], U); // LEFT
  return new Float32Array(v);
})();

/* 単位平面（XZ, y=0, 法線+Y）。UVはTOP面と同じ向き */
const PLANE_GEOMETRY = new Float32Array([
  -0.5, 0, 0.5, 0, 0, 0, 1, 0,
  0.5, 0, 0.5, 1, 0, 0, 1, 0,
  0.5, 0, -0.5, 1, 1, 0, 1, 0,
  -0.5, 0, 0.5, 0, 0, 0, 1, 0,
  0.5, 0, -0.5, 1, 1, 0, 1, 0,
  -0.5, 0, -0.5, 0, 1, 0, 1, 0
]);

const Stage3D = (() => {
  const FACE = { TOP: 0, BOTTOM: 6, FRONT: 12, BACK: 18, RIGHT: 24, LEFT: 30 };
  const ALL = [FACE.TOP, FACE.BOTTOM, FACE.FRONT, FACE.BACK, FACE.RIGHT, FACE.LEFT];

  /* opt: { W, H, clear, light, ambient, camera:{eye,at,fov,focus,dofScale,blur}, draw(api) }
   * draw() はカラーパスとCoCパスで2回呼ばれる。api.mode が 0 のときだけ
   * 半透明（影など）を描くと、被写界深度マスクが濁らない。 */
  function render(ctx, opt) {
    const gl = GLX.gl;
    if (!gl) return false;
    const W = opt.W, H = opt.H;
    // WebGLにはFBO描画へのMSAAが無いので、2倍で描いてから縮小して
    // ポリゴンの縁と細い文字のジャギーを均す（スーパーサンプリング）
    const lim = Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE), gl.getParameter(gl.MAX_RENDERBUFFER_SIZE));
    const ss = (Math.max(W, H) * 2 <= lim) ? 2 : 1;
    const RW = W * ss, RH = H * ss;
    GLX.resize(RW, RH);
    const trash = [];
    const prog = GLX.program('stage', VS_STAGE, FS_STAGE);

    const boxBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, boxBuf);
    gl.bufferData(gl.ARRAY_BUFFER, BOX_GEOMETRY, gl.STATIC_DRAW);
    const planeBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, planeBuf);
    gl.bufferData(gl.ARRAY_BUFFER, PLANE_GEOMETRY, gl.STATIC_DRAW);

    const cam = opt.camera;
    const view = M4.lookAt(cam.eye, cam.at, [0, 1, 0]);
    const proj = M4.perspective(cam.fov || 30, 1, 0.05, 300);
    const vp = M4.mul(proj, view);
    const common = {
      u_view: view,
      u_light: opt.light || [0.40, 0.86, 0.45],
      u_ambient: opt.ambient === undefined ? 0.42 : opt.ambient,
      u_focus: cam.focus,
      u_dofScale: cam.dofScale === undefined ? 0.4 : cam.dofScale
    };

    let mode = 0, bound = null;
    const bind = (buf) => {
      if (bound === buf) return;
      bound = buf;
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 32, 0);
      gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 32, 12);
      gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 32, 20);
    };
    const draw = (m, u, first, count) => {
      GLX.setUniforms(prog, Object.assign({
        u_mvp: M4.mul(vp, m), u_model: m, u_mode: mode,
        u_useTex: 0, u_unlit: 0, u_alpha: 1, u_color: [1, 1, 1], u_uvScale: [1, 1]
      }, common, u));
      gl.drawArrays(gl.TRIANGLES, first, count);
    };

    const api = {
      get mode() { return mode; },
      /* 半透明（影・光）を描くときは true → 描き終えたら false */
      blend(on) {
        if (on) {
          gl.enable(gl.BLEND);
          gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
          gl.depthMask(false);
        } else { gl.disable(gl.BLEND); gl.depthMask(true); }
      },
      /* pos/rot/size の直方体。tex を渡すと face 面だけテクスチャ、他は edge 色 */
      box(pos, rot, size, o) {
        o = o || {};
        bind(boxBuf);
        const m = M4.compose(pos, rot, size);
        const shared = {
          u_alpha: o.alpha === undefined ? 1 : o.alpha,
          u_unlit: o.unlit ? 1 : 0
        };
        if (o.tex) {
          const fi = o.face === undefined ? FACE.TOP : o.face;
          draw(m, Object.assign({ u_useTex: 1, u_tex: { tex: o.tex } }, shared), fi, 6);
          const edge = o.edge || [0.94, 0.92, 0.86];
          for (const fa of ALL) if (fa !== fi) draw(m, Object.assign({ u_color: edge }, shared), fa, 6);
        } else {
          draw(m, Object.assign({ u_color: o.color || [0.8, 0.8, 0.8] }, shared), 0, 36);
        }
        return m;
      },
      /* XZ平面（床・壁・影）。rot で立てれば壁になる */
      quad(pos, rot, size, o) {
        o = o || {};
        bind(planeBuf);
        const m = M4.compose(pos, rot, [size[0], 1, size[1]]);
        draw(m, {
          u_useTex: o.tex ? 1 : 0, u_tex: o.tex ? { tex: o.tex } : undefined,
          u_color: o.color || [1, 1, 1], u_alpha: o.alpha === undefined ? 1 : o.alpha,
          u_unlit: o.unlit ? 1 : 0, u_uvScale: o.uvScale || [1, 1]
        }, 0, 6);
        return m;
      }
    };

    const runPass = (target, m) => {
      mode = m; bound = null;
      gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb);
      gl.viewport(0, 0, target.w, target.h);
      gl.useProgram(prog);
      gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(true);
      gl.disable(gl.BLEND); gl.disable(gl.CULL_FACE);
      const c = m === 1 ? [1, 1, 1] : (opt.clear || [0.09, 0.09, 0.10]);
      gl.clearColor(c[0], c[1], c[2], 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      opt.draw(api);
      gl.disable(gl.BLEND); gl.depthMask(true);
    };

    // カラーは等倍以上で、CoCマスクとぼかしは等倍で十分（どちらも滑らかなため）
    const fC = GLX.fbo(RW, RH, true), fZ = GLX.fbo(W, H, true),
          fA = GLX.fbo(W, H), fB = GLX.fbo(W, H);
    trash.push(fC, fZ, fA, fB);
    runPass(fC, 0);
    runPass(fZ, 1);

    const pBlur = GLX.program('blur', VS_FULL, FS_BLUR);
    const pDof = GLX.program('dof', VS_FULL, FS_DOF);
    const br = cam.blur === undefined ? 8 : cam.blur;
    GLX.pass(pBlur, { u_tex: { tex: fC.tex }, u_dir: [1, 0], u_radius: br }, fA);
    GLX.pass(pBlur, { u_tex: { tex: fA.tex }, u_dir: [0, 1], u_radius: br }, fB);
    GLX.pass(pDof, { u_sharp: { tex: fC.tex }, u_blur: { tex: fB.tex }, u_coc: { tex: fZ.tex } }, null);

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(GLX.canvas, 0, 0, W, H);
    gl.deleteBuffer(boxBuf); gl.deleteBuffer(planeBuf);
    GLX.dispose(trash);
    return true;
  }

  return { render, FACE };
})();

/* --- チョーク画（黒板モード用）: 輪郭と明部を白い擦れとして抜き出す --- */
const FS_CHALK = FS_HEAD + GLSL_NOISE + `
uniform sampler2D u_tex;
uniform float u_strength;
uniform float u_tint;      // 0 = 白チョークのみ / 1 = 元の色を残した色チョーク
uniform vec3 u_chalk;
float lm(vec2 uv){ vec4 c = texture(u_tex, uv); return luma(c.rgb) * c.a; }
void main(){
  vec2 px = 1.0 / u_res;
  float gx = lm(v_uv+px*vec2(-1,-1)) + 2.0*lm(v_uv+px*vec2(-1,0)) + lm(v_uv+px*vec2(-1,1))
           - lm(v_uv+px*vec2( 1,-1)) - 2.0*lm(v_uv+px*vec2( 1,0)) - lm(v_uv+px*vec2( 1,1));
  float gy = lm(v_uv+px*vec2(-1,-1)) + 2.0*lm(v_uv+px*vec2(0,-1)) + lm(v_uv+px*vec2(1,-1))
           - lm(v_uv+px*vec2(-1, 1)) - 2.0*lm(v_uv+px*vec2(0, 1)) - lm(v_uv+px*vec2(1, 1));
  float edge = smoothstep(0.06, 0.34, length(vec2(gx, gy)));
  vec4 src = texture(u_tex, v_uv);
  // 色チョークのときは面を広めに拾って、色が乗る範囲を増やす
  float lo   = mix(0.60, 0.16, u_tint);
  float amt  = mix(0.42, 0.66, u_tint);
  float body = smoothstep(lo, 1.0, luma(src.rgb)) * src.a * amt;
  float a = clamp(edge * 1.7 + body, 0.0, 1.0);
  // チョークのかすれ
  a *= 0.45 + 0.55 * fbm(v_uv * u_res * 0.05);
  a *= 0.72 + 0.28 * hash12(v_uv * u_res * 0.9);

  // パステル化：彩度をやや落として白に寄せると、粉っぽいチョークの発色になる
  vec3 pastel = mix(vec3(luma(src.rgb)), src.rgb, 0.92);
  pastel = mix(pastel, vec3(1.0), 0.28);
  // 被写体の外側（＝輪郭線）は白チョークのままにする
  vec3 col = mix(u_chalk, pastel, u_tint * smoothstep(0.02, 0.45, src.a));
  col = mix(col, col * 0.86, edge * u_tint * 0.6);
  fragColor = vec4(col, clamp(a * u_strength, 0.0, 1.0));
}`;

function fxChalk(src, w, h, opt) {
  opt = opt || {};
  return glRun(w, h, (gl, trash) => {
    const p = GLX.program('chalk', VS_FULL, FS_CHALK);
    const tex = GLX.texture(src); trash.push(tex);
    gl.clearColor(0, 0, 0, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, w, h);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    GLX.pass(p, {
      u_tex: { tex }, u_strength: opt.strength === undefined ? 1.0 : opt.strength,
      u_tint: opt.tint ? 1.0 : 0.0,
      u_chalk: opt.chalk || [0.93, 0.95, 0.92]
    }, null);
    gl.disable(gl.BLEND);
  });
}

let _shadowTex = null;

/* 素材テクスチャ: 木目・金属・紙などの平面用 */
function surfaceTexture(kind) {
  const S = 512;
  const c = newCanvas(S, S);
  const x = c.getContext('2d');
  const r = rnd(kind.length * 977 + 13);
  const pal = {
    wood: ['#7a5c42', '#95765a', '#5f4632'],
    pale: ['#cfd3d8', '#e6e9ed', '#b6bcc4'],
    metal: ['#8e959d', '#aab1b9', '#727981'],
    carpet: ['#4a1f27', '#5d2a33', '#331419'],
    stone: ['#9a9791', '#b3b0a9', '#7e7b76']
  }[kind] || ['#888', '#aaa', '#666'];
  const g = x.createLinearGradient(0, 0, 0, S);
  g.addColorStop(0, pal[1]); g.addColorStop(0.5, pal[0]); g.addColorStop(1, pal[2]);
  x.fillStyle = g; x.fillRect(0, 0, S, S);
  if (kind === 'wood') {
    for (let i = 0; i < 240; i++) {
      x.globalAlpha = 0.05 + r() * 0.1;
      x.fillStyle = r() > 0.5 ? '#e8d4bd' : '#3a2b1e';
      x.fillRect(0, r() * S, S, 0.7 + r() * 2.2);
    }
  } else if (kind === 'stone') {
    x.globalAlpha = 0.5; x.strokeStyle = '#6f6c67'; x.lineWidth = 2;
    for (let i = 0; i <= 4; i++) { x.beginPath(); x.moveTo(0, i * S / 4); x.lineTo(S, i * S / 4); x.stroke(); }
    for (let i = 0; i <= 4; i++) { x.beginPath(); x.moveTo(i * S / 4, 0); x.lineTo(i * S / 4, S); x.stroke(); }
  } else if (kind === 'carpet') {
    for (let i = 0; i < 900; i++) {
      x.globalAlpha = 0.05 + r() * 0.12;
      x.fillStyle = r() > 0.5 ? '#8a3f4c' : '#250f13';
      x.fillRect(r() * S, r() * S, 3 + r() * 8, 3 + r() * 8);
    }
  }
  x.globalAlpha = 1;
  drawGrain(x, S, S, 0.09, 9, 2);
  return c;
}

 * [7] モード定義

const MODES = [];

/* 同じ絵を色違いに見せる（周囲に並ぶ「別の号・別の本」用） */
function tintCopy(src, deg, bright) {
  const c = newCanvas(src.width, src.height);
  const x = c.getContext('2d');
  try { x.filter = `hue-rotate(${deg}deg) brightness(${bright === undefined ? 1 : bright})`; } catch (e) { }
  x.drawImage(src, 0, 0);
  x.filter = 'none';
  return c;
}
/* 名前のない「その他の紙面」（売店に並ぶ他紙など） */
function dummyPage(w, h, seed, paper, ink) {
  const c = newCanvas(w, h);
  const x = c.getContext('2d');
  const r = rnd(seed);
  x.fillStyle = paper; x.fillRect(0, 0, w, h);
  x.fillStyle = ink;
  x.fillRect(w * 0.08, h * 0.05, w * 0.84, h * 0.075);
  x.globalAlpha = 0.7;
  x.fillRect(w * 0.08, h * 0.15, w * 0.84, h * 0.055);
  x.globalAlpha = 0.18;
  x.fillRect(w * 0.08, h * 0.24, w * 0.42, h * 0.30);
  x.globalAlpha = 0.30;
  let y = h * 0.24;
  while (y < h * 0.93) {
    x.fillRect(w * 0.54, y, w * (0.20 + r() * 0.18), h * 0.012);
    y += h * 0.028;
  }
  y = h * 0.58;
  while (y < h * 0.93) {
    x.fillRect(w * 0.08, y, w * (0.20 + r() * 0.20), h * 0.012);
    y += h * 0.028;
  }
  x.globalAlpha = 1;
  drawGrain(x, w, h, 0.06, seed, 2);
  return c;
}

  render(ctx, env) {
    const W = env.W, H = env.H;
    const art = this.art(env);
    if (!GLX.available()) { ctx.drawImage(art, (W - H * art.width / art.height) / 2, 0, H * art.width / art.height, H); return; }

    const covers = [GLX.texture(art), GLX.texture(tintCopy(art, 26, 0.98)), GLX.texture(tintCopy(art, -24, 1.02))];
    const table = GLX.texture(surfaceTexture('pale'), { repeat: true });

    const trash = [...covers, table, shadow];

    // 雑誌1冊 = 幅1.10 x 奥行1.55 x 厚み0.032
    const MW = 1.10, MD = 1.55, MT = 0.032;
    const r = rnd(20260903);
    const stacks = [];
    const PX = 1.26, PZ = 1.74, COLS = 5, ROWS = 5, HC = 2, HR = 0;
    for (let ci = 0; ci < COLS; ci++) for (let zi = 0; zi < ROWS; zi++) {

      const n = hero ? 9 : 4 + Math.floor(r() * 6);
      stacks.push({
        x: (ci - (COLS - 1) / 2) * PX, z: 1.30 - zi * PZ, n, hero,
        tex: covers[(ci * 2 + zi) % covers.length],
        jitter: hero ? 0.012 : 0.05, seed: r()
      });
    }
    const hero = stacks[HC * ROWS + HR];
    const heroTop = MT * hero.n;
    const fp = [hero.x, heroTop, hero.z];
    // 書籍より俯瞰を強くしつつ、一冊が画面に収まる距離まで引く
    const eye = [fp[0] + 1.18, fp[1] + 3.34, fp[2] + 1.84];

    Stage3D.render(ctx, {
      W, H, clear: [0.16, 0.16, 0.17], ambient: 0.50,
      light: [0.32, 0.90, 0.40],
      camera: {
        eye, at: [fp[0] + 0.02, fp[1] - 0.10, fp[2] + 0.02], fov: 30,
        focus: Math.hypot(eye[0] - fp[0], eye[1] - fp[1], eye[2] - fp[2]),
        dofScale: 0.55, blur: 9
