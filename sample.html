      drawTracked(x, ln, CW / 2, sy + ss, ss * 0.02, 'center');
      sy += ss * 1.5;
    }
    x.fillStyle = 'rgba(255,255,255,0.5)';
    x.fillRect(26, OBI_TOP + 20, 3, obiH - 40);
    x.fillRect(CW - 29, OBI_TOP + 20, 3, obiH - 40);
    drawGrain(x, CW, CH, 0.05, 61, 2);
    return c;
  },

  render(ctx, env) {
    const W = env.W, H = env.H;
    const cover = this.art(env, 0);
    if (!GLX.available()) {
      const cw = W * 0.62, ch = cw * (cover.height / cover.width);
      ctx.fillStyle = '#2b2118'; ctx.fillRect(0, 0, W, H);
      ctx.drawImage(cover, (W - cw) / 2, (H - ch) / 2, cw, ch);
      return;
    }
    const covers = [GLX.texture(cover), GLX.texture(this.art(env, 22)), GLX.texture(this.art(env, -20))];
    const table = GLX.texture(surfaceTexture('wood'), { repeat: true });
    const shadow = GLX.texture(shadowTexture());
    const trash = [...covers, table, shadow];

    const BW = 1.10, BT = 0.15, BD = 1.56;
    const r = rnd(20260902);
    const stacks = [];
    const PX = 1.19, PZ = 1.66, COLS = 7, ROWS = 8, HC = 3, HR = 1;
    for (let ci = 0; ci < COLS; ci++) for (let zi = 0; zi < ROWS; zi++) {
      const hero = (ci === HC && zi === HR);
      stacks.push({
        x: (ci - (COLS - 1) / 2) * PX, z: 1.45 - zi * PZ,
        n: hero ? 5 : 2 + Math.floor(r() * 3),
        tex: covers[(ci * 2 + zi) % covers.length],
        jitter: hero ? 0.015 : 0.05, seed: r(), hero
      });
    }
    const hero = stacks[HC * ROWS + HR];
    const fp = [hero.x, BT * hero.n, hero.z];
    const eye = [fp[0] + 2.04, fp[1] + 2.44, fp[2] + 2.64];

    Stage3D.render(ctx, {
      W, H, clear: [0.09, 0.07, 0.06], ambient: 0.38,
      light: [0.42, 0.86, 0.52],
      camera: {
        eye, at: [fp[0] + 0.10, fp[1] - 0.16, fp[2] + 0.05], fov: 30,
        focus: Math.hypot(eye[0] - fp[0], eye[1] - fp[1], eye[2] - fp[2]),
        dofScale: 0.55, blur: 8
      },
      draw(api) {
        api.quad([0, 0, -2.6], [0, 0, 0], [14, 14], { tex: table, uvScale: [7, 7] });
        if (api.mode === 0) {
          api.blend(true);
          for (const st of stacks) {
            api.quad([st.x, 0.004, st.z + 0.05], [0, 0, 0], [BW * 1.22, BD * 1.42], { tex: shadow, unlit: true });
          }
          api.blend(false);
        }
        for (const st of stacks) {
          const rr = rnd(Math.floor(st.seed * 100000) + 5);
          for (let i = 0; i < st.n; i++) {
            api.box([st.x + (rr() - 0.5) * st.jitter, BT * (i + 0.5), st.z + (rr() - 0.5) * st.jitter],
              [0, (rr() - 0.5) * 5, 0], [BW, BT, BD],
              { tex: st.tex, face: Stage3D.FACE.TOP, edge: [0.94, 0.92, 0.86] });
          }
        }
      }
    });
    GLX.dispose(trash);

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const lg = ctx.createRadialGradient(W * 0.5, H * 0.16, 20, W * 0.5, H * 0.3, W * 0.8);
    lg.addColorStop(0, 'rgba(255,232,190,0.20)');
    lg.addColorStop(1, 'rgba(255,232,190,0)');
    ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
    ctx.restore();
    drawVignette(ctx, W, H, 0.48);
    drawGrain(ctx, W, H, 0.05, 33, 2);
  }
});

/* -------------------------------------------------------------------------
 * 7.6 喫茶店の黒板 — 街角の店先、入口の前に置かれたA型看板
 * ---------------------------------------------------------------------- */
MODES.push({
  id: 'chalkboard',
  name: '喫茶店の黒板',
  heavy: true,
  fields: [
    { key: 'shop', label: '店名', type: 'text', def: 'CAFE OHAYO', placeholder: 'CAFE OHAYO' },
    { key: 'head', label: '見出し', type: 'text', def: '本日のおすすめ', placeholder: '本日のおすすめ' },
    {
      key: 'menu', label: 'メニュー', type: 'textarea', rows: 4,
      def: 'モーニングセット｜¥680\nおはようブレンド｜¥450\n目覚めのトースト｜¥380',
      placeholder: 'モーニングセット｜¥680'
    },
    { key: 'foot', label: '下部テキスト', type: 'text', def: 'OPEN 7:00 - 11:00', placeholder: 'OPEN 7:00 - 11:00' },
    { key: 'colored', label: '色チョークで描く', type: 'toggle', def: true }
  ],

  art(env) {
    const W = 820, H = 1150;
    const { img, meta, v } = env;
    const c = newCanvas(W, H);
    const x = c.getContext('2d');

    // 黒板の地
    const g = x.createLinearGradient(0, 0, W * 0.3, H);
    g.addColorStop(0, '#2a3a33');
    g.addColorStop(0.5, '#1f2c27');
    g.addColorStop(1, '#18231f');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    // 拭き跡
    const rw = rnd(808);
    x.save();
    for (let i = 0; i < 26; i++) {
      x.globalAlpha = 0.02 + rw() * 0.05;
      x.fillStyle = '#cfe0d6';
      const yy = rw() * H, hh = 20 + rw() * 70;
      x.beginPath();
      x.ellipse(rw() * W, yy, 160 + rw() * 260, hh, (rw() - 0.5) * 0.4, 0, Math.PI * 2);
      x.fill();
    }
    x.restore();
    drawVignette(x, W, H, 0.5);

    // ここから白チョーク層。最後にまとめてかすれさせる
    const ch = newCanvas(W, H);
    const k = ch.getContext('2d');
    const CHALK = '#eef3ec';
    k.strokeStyle = CHALK; k.fillStyle = CHALK;
    k.textBaseline = 'alphabetic';

    // 外枠（二重罫＋角飾り）
    k.lineWidth = 3; roundRect(k, 34, 34, W - 68, H - 68, 14); k.stroke();
    k.lineWidth = 1.4; roundRect(k, 46, 46, W - 92, H - 92, 10); k.stroke();
    for (const [cx2, cy2] of [[34, 34], [W - 34, 34], [34, H - 34], [W - 34, H - 34]]) {
      k.save(); k.translate(cx2, cy2); k.rotate(Math.PI / 4);
      k.fillRect(-6, -6, 12, 12); k.restore();
    }

    // 店名
    const shop = (v.shop || '').toUpperCase();
    const ss = fitSize(k, shop, 700, FONT.fantasy, W - 160, 66, 20, 0.09);
    k.font = f(700, ss, FONT.fantasy);
    drawTracked(k, shop, W / 2, 122, ss * 0.09, 'center');
    k.lineWidth = 2;
    k.beginPath(); k.moveTo(W / 2 - 170, 146); k.lineTo(W / 2 + 170, 146); k.stroke();
    k.save(); k.translate(W / 2, 146); k.rotate(Math.PI / 4); k.fillRect(-5, -5, 10, 10); k.restore();

    // チョークで描いた立ち絵（右側）
    const pw = 400, ph = 600;
    const sub = newCanvas(pw, ph);
    const sx = sub.getContext('2d');
    const sp = place(env, { x: 8, y: 8, w: pw - 16, h: ph - 16 },
      { fit: 'contain', anchorY: 1, anchorX: 0.5 });
    sx.drawImage(img, sp.x, sp.y, sp.w, sp.h);
    const chalked = fxChalk(sub, pw, ph, {
      strength: v.colored ? 1.15 : 1.25,
      tint: !!v.colored,
      chalk: [0.95, 0.97, 0.94]
    });
    if (chalked) k.drawImage(chalked, W - pw - 26, 176, pw, ph);
    else { k.save(); k.globalAlpha = 0.5; k.drawImage(sub, W - pw - 26, 176, pw, ph); k.restore(); }

    // 見出し
    const head = v.head || '';
    const hs = fitSize(k, head, 700, FONT.sans, 330, 44, 16, 0.02);
    k.font = f(700, hs, FONT.sans);
    drawTracked(k, head, 66, 244, hs * 0.02, 'left');
    k.lineWidth = 2.5;
    k.beginPath(); k.moveTo(66, 262); k.lineTo(66 + trackedWidth(k, head, hs * 0.02), 262); k.stroke();

    // メニュー
    const items = String(v.menu || '').split('\n').map(t => t.trim()).filter(Boolean).slice(0, 5);
    const rowH = Math.min(78, (H - 420) / Math.max(items.length, 1));
    let my = 330;
    for (const it of items) {
      const sep = it.indexOf('｜') >= 0 ? '｜' : (it.indexOf('|') >= 0 ? '|' : '\t');
      const i2 = it.indexOf(sep);
      const name = i2 >= 0 ? it.slice(0, i2).trim() : it;
      const price = i2 >= 0 ? it.slice(i2 + 1).trim() : '';
      const ns = fitSize(k, name, 400, FONT.sans, 250, 31, 12, 0.01);
      k.font = f(400, ns, FONT.sans);
      drawTracked(k, name, 66, my, ns * 0.01, 'left');
      const nw = trackedWidth(k, name, ns * 0.01);
      if (price) {
        k.font = f(700, 29, FONT.cond);
        k.textAlign = 'right'; k.fillText(price, 400, my); k.textAlign = 'left';
        const pw2 = k.measureText(price).width;
        k.save(); k.globalAlpha = 0.55; k.lineWidth = 1.6;
        k.setLineDash([2, 7]);
        k.beginPath(); k.moveTo(66 + nw + 10, my - 8); k.lineTo(400 - pw2 - 10, my - 8); k.stroke();
        k.restore(); k.setLineDash([]);
      }
      my += rowH;
    }

    // 下部（OPEN表示）
    const foot = (v.foot || '').toUpperCase();
    if (foot) {
      const fs = fitSize(k, foot, 600, FONT.cond, W - 260, 34, 12, 0.16);
      k.font = f(600, fs, FONT.cond);
      const fw = trackedWidth(k, foot, fs * 0.16);
      k.lineWidth = 2.2;
      roundRect(k, W / 2 - fw / 2 - 26, H - 138, fw + 52, 62, 10); k.stroke();
      drawTracked(k, foot, W / 2, H - 96, fs * 0.16, 'center');
    }
    // 小さな飾り（湯気の立つカップ）
    k.save();
    k.translate(88, H - 120); k.lineWidth = 2.4;
    k.beginPath(); k.moveTo(0, 0); k.lineTo(4, 26); k.lineTo(34, 26); k.lineTo(38, 0); k.closePath(); k.stroke();
    k.beginPath(); k.arc(44, 10, 9, -Math.PI / 2, Math.PI / 2); k.stroke();
    k.lineWidth = 2;
    for (const dx of [8, 19, 30]) {
      k.beginPath();
      k.moveTo(dx, -8); k.quadraticCurveTo(dx + 7, -18, dx, -28);
      k.stroke();
    }
    k.restore();

    // チョークのかすれ（層全体を粒で削る）
    const nz = newCanvas(Math.ceil(W / 2), Math.ceil(H / 2));
    const ng = nz.getContext('2d');
    const nid = ng.createImageData(nz.width, nz.height);
    const rn = rnd(2468);
    for (let i = 0; i < nz.width * nz.height; i++) {
      nid.data[i * 4 + 3] = rn() < 0.34 ? Math.floor(rn() * 210) : 0;
    }
    ng.putImageData(nid, 0, 0);
    k.globalCompositeOperation = 'destination-out';
    k.globalAlpha = 0.55;
    k.drawImage(nz, 0, 0, W, H);
    k.globalCompositeOperation = 'source-over';
    k.globalAlpha = 1;

    x.drawImage(ch, 0, 0);
    drawGrain(x, W, H, 0.05, 17, 2);
    return c;
  },

  render(ctx, env) {
    const W = env.W, H = env.H;
    const art = this.art(env);
    if (!GLX.available()) { ctx.drawImage(art, (W - H * art.width / art.height) / 2, 0, H * art.width / art.height, H); return; }

    const boardTex = GLX.texture(art);
    const ground = GLX.texture(surfaceTexture('stone'), { repeat: true });
    const wood = GLX.texture(surfaceTexture('wood'), { repeat: true });
    const shadow = GLX.texture(shadowTexture());
    const trash = [boardTex, ground, wood, shadow];

    const BW = 0.66, BH = 0.926, TILT = -10;
    const boardPos = [0, 0.74, 0];
    const eye = [0.71, 1.22, 1.33];
    const at = [-0.02, 0.76, 0.0];

    Stage3D.render(ctx, {
      W, H, clear: [0.14, 0.13, 0.12], ambient: 0.50,
      light: [0.45, 0.80, 0.45],
      camera: {
        eye, at, fov: 38,
        focus: Math.hypot(eye[0] - boardPos[0], eye[1] - boardPos[1], eye[2] - boardPos[2]),
        dofScale: 0.75, blur: 10
      },
      draw(api) {
        api.quad([0, 0, -0.4], [0, 0, 0], [16, 16], { tex: ground, uvScale: [8, 8] });
        // 店の正面
        api.box([0, 1.6, -1.78], [0, 0, 0], [7, 3.2, 0.18], { tex: wood, face: Stage3D.FACE.FRONT, edge: [0.35, 0.26, 0.19] });
        api.box([0, 0.07, -1.48], [0, 0, 0], [7, 0.14, 0.55], { color: [0.62, 0.60, 0.56] });
        // 窓（店内の灯り）
        api.box([-1.05, 1.36, -1.66], [0, 0, 0], [1.86, 1.26, 0.05], { color: [0.20, 0.16, 0.13] });
        api.box([-1.05, 1.36, -1.63], [0, 0, 0], [1.72, 1.12, 0.04], { color: [0.98, 0.86, 0.62], unlit: true });
        // 扉
        api.box([1.28, 1.04, -1.64], [0, 0, 0], [1.0, 2.08, 0.08], { color: [0.24, 0.16, 0.11] });
        api.box([1.28, 1.72, -1.60], [0, 0, 0], [0.72, 0.5, 0.04], { color: [0.95, 0.84, 0.62], unlit: true });
        // 吊り看板
        api.box([1.28, 2.42, -1.50], [0, 0, 0], [0.78, 0.28, 0.06], { color: [0.20, 0.15, 0.11] });
        // 植木
        api.box([-1.02, 0.19, -0.72], [0, 12, 0], [0.38, 0.38, 0.38], { color: [0.52, 0.30, 0.22] });
        api.box([-1.02, 0.62, -0.72], [0, 20, 0], [0.46, 0.52, 0.42], { color: [0.24, 0.40, 0.24] });

        if (api.mode === 0) {
          api.blend(true);
          api.quad([0, 0.005, -0.06], [0, 0, 0], [1.15, 1.05], { tex: shadow, unlit: true });
          api.blend(false);
        }
        // A型看板：木枠 → 黒板面 → 後脚
        api.box([0, 0.5, -0.34], [16, 0, 0], [0.09, 1.02, 0.06], { tex: wood, face: Stage3D.FACE.FRONT, edge: [0.42, 0.31, 0.22] });
        api.box([0, 0.12, -0.18], [0, 0, 0], [0.5, 0.05, 0.05], { color: [0.42, 0.31, 0.22] });
        api.box(boardPos, [TILT, 0, 0], [BW + 0.10, BH + 0.10, 0.05],
          { tex: wood, face: Stage3D.FACE.FRONT, edge: [0.42, 0.31, 0.22] });
        api.box([boardPos[0], boardPos[1], boardPos[2] + 0.032], [TILT, 0, 0], [BW, BH, 0.02],
          { tex: boardTex, face: Stage3D.FACE.FRONT, edge: [0.10, 0.13, 0.11] });
      }
    });
    GLX.dispose(trash);

    // 朝の斜光
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const lg = ctx.createLinearGradient(W * 0.9, 0, W * 0.1, H * 0.8);
    lg.addColorStop(0, 'rgba(255,232,178,0.26)');
    lg.addColorStop(0.55, 'rgba(255,232,178,0.05)');
    lg.addColorStop(1, 'rgba(255,232,178,0)');
    ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
    ctx.restore();
    drawVignette(ctx, W, H, 0.44);
    drawGrain(ctx, W, H, 0.045, 23, 2);
  }
});

/* =========================================================================
 * [8] アプリ本体（状態管理・UI・出力）
 * ====================================================================== */

/* X に投稿する本文。タグも地の文も入れず、配布ページのリンクだけを載せる */
const SHARE_URL = 'https://ginka1108.github.io/ohav_recommend/';

const app = (() => {
  const cv = $('preview');
  const ctx = cv.getContext('2d');
  const state = {
    modeId: MODES[0].id,
    img: null,
    meta: null,
    fileName: '',
    values: {},          // modeId -> { key: value }
    adjust: {},          // modeId -> { scale, dx, dy }（立ち絵の微調整）
    blob: null,
    rendering: false,
    dirty: false
  };
  // 各モードの初期値をセット（未入力でも成立する）
  for (const m of MODES) {
    state.values[m.id] = {};
    for (const fl of m.fields) state.values[m.id][fl.key] = fl.def === undefined ? '' : fl.def;
    state.adjust[m.id] = { scale: 1, dx: 0, dy: 0 };
  }

  const mode = () => MODES.find(m => m.id === state.modeId);

  /* ---- トースト ---- */
  let toastT = 0;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(() => el.classList.remove('on'), 2600);
  }

  /* ---- タブ ---- */
  function buildTabs() {
    const wrap = $('tabs');
    wrap.innerHTML = '';
    for (const m of MODES) {
      const b = document.createElement('button');
      b.className = 'tab';
      b.type = 'button';
      b.textContent = m.name;
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(m.id === state.modeId));
      b.onclick = () => {
        if (state.modeId === m.id) return;
        state.modeId = m.id;
        buildTabs(); buildFields(); syncAdjust();
        scheduleRender(true);
      };
      wrap.appendChild(b);
    }
  }

  /* ---- 入力フォーム ---- */
  function buildFields() {
    const wrap = $('fields');
    wrap.innerHTML = '';
    const m = mode();
    for (const fl of m.fields) {
      const d = document.createElement('div');
      d.className = 'field';
      if (fl.type === 'toggle') {
        const tg = document.createElement('label');
        tg.className = 'toggle';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.id = 'fld_' + fl.key;
        cb.checked = !!state.values[m.id][fl.key];
        cb.addEventListener('change', () => {
          state.values[m.id][fl.key] = cb.checked;
          scheduleRender(true);
        });
        const txt = document.createElement('span');
        txt.textContent = fl.label;
        tg.appendChild(cb); tg.appendChild(txt);
        d.appendChild(tg);
        wrap.appendChild(d);
        continue;
      }
      const lb = document.createElement('label');
      lb.textContent = fl.label;
      lb.htmlFor = 'fld_' + fl.key;
      d.appendChild(lb);
      const el = document.createElement(fl.type === 'textarea' ? 'textarea' : 'input');
      el.id = 'fld_' + fl.key;
      if (fl.type !== 'textarea') el.type = 'text';
      else el.rows = fl.rows || 3;
      el.placeholder = fl.placeholder || '';
      el.value = state.values[m.id][fl.key] || '';
      el.addEventListener('input', () => {
        state.values[m.id][fl.key] = el.value;
        scheduleRender(false);
      });
      d.appendChild(el);
      wrap.appendChild(d);
    }
  }

  /* ---- 立ち絵の位置・大きさ ---- */
  function syncAdjust() {
    const a = state.adjust[state.modeId];
    $('adjScale').value = Math.round(a.scale * 100);
    $('adjX').value = Math.round(a.dx * 100);
    $('adjY').value = Math.round(a.dy * 100);
    $('adjScaleV').textContent = Math.round(a.scale * 100) + '%';
    $('adjXV').textContent = (a.dx > 0 ? '+' : '') + Math.round(a.dx * 100);
    $('adjYV').textContent = (a.dy > 0 ? '+' : '') + Math.round(a.dy * 100);
  }
  function wireAdjust() {
    const bind = (id, key, div) => {
      $(id).addEventListener('input', () => {
        state.adjust[state.modeId][key] = Number($(id).value) / div;
        syncAdjust();
        scheduleRender(false);
      });
    };
    bind('adjScale', 'scale', 100);
    bind('adjX', 'dx', 100);
    bind('adjY', 'dy', 100);
    $('adjReset').onclick = () => {
      state.adjust[state.modeId] = { scale: 1, dx: 0, dy: 0 };
      syncAdjust();
      scheduleRender(true);
    };
    syncAdjust();
  }

  /* ---- 画像読み込み ---- */
  function loadFile(file) {
    if (!file || !/^image\//.test(file.type)) { toast('画像ファイルを選んでください'); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      state.img = img;
      state.meta = analyzeImage(img);
      state.fileName = file.name;
      updateDropUI(file, img);
      $('empty').style.display = 'none';
      scheduleRender(true);
    };
    img.onerror = () => { toast('画像を読み込めませんでした'); URL.revokeObjectURL(url); };
    img.src = url;
  }
  function updateDropUI(file, img) {
    const drop = $('drop');
    drop.classList.add('has');
    drop.innerHTML = `
      <img class="thumb" src="${img.src}" alt="">
      <div class="finfo">${file.name.replace(/[<>&]/g, '')}</div>
      <button class="mini" type="button" id="btnChange">変更</button>
      <input type="file" id="file" accept="image/*">`;
    wireDrop();
    $('btnChange').onclick = (e) => { e.stopPropagation(); $('file').click(); };
  }
  function wireDrop() {
    const drop = $('drop');
    const input = $('file');
    drop.onclick = (e) => { if (e.target.tagName !== 'BUTTON') input.click(); };
    input.onchange = () => { if (input.files[0]) loadFile(input.files[0]); };
    drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = (e) => {
      e.preventDefault(); drop.classList.remove('over');
      if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
    };
  }
  window.addEventListener('paste', (e) => {
    const items = e.clipboardData && e.clipboardData.files;
    if (items && items[0]) loadFile(items[0]);
  });

  /* ---- フォント読み込み（描画前に必ず解決させる） ---- */
  let fontsReady = null;
  function ensureFonts() {
    if (fontsReady) return fontsReady;
    const specs = [
      '400 100px "Anton"', '400 100px "Cinzel"', '500 100px "Cinzel"', '700 100px "Cinzel"',
      '400 100px "Oswald"', '600 100px "Oswald"', '700 100px "Oswald"',
      '400 100px "Noto Sans JP"', '700 100px "Noto Sans JP"', '900 100px "Noto Sans JP"',
      '400 100px "Noto Serif JP"', '700 100px "Noto Serif JP"', '900 100px "Noto Serif JP"'
    ];
    const jobs = specs.map(s => {
      try { return document.fonts.load(s, 'おはようVtuber ABC 0123'); }
      catch (e) { return Promise.resolve(); }
    });
    fontsReady = Promise.all(jobs).then(() => document.fonts.ready).catch(() => { });
    return fontsReady;
  }

  /* ---- 描画 ---- */
  // 描画前に1フレーム待ってスピナーを表示させる。タブが非表示だと
  // requestAnimationFrame が止まるため、タイマー側でも必ず進むようにする。
  const nextFrame = () => new Promise(r => {
    let done = false;
    const fin = () => { if (!done) { done = true; r(); } };
    requestAnimationFrame(() => requestAnimationFrame(fin));
    setTimeout(fin, 150);
  });

  function resetCtx() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.filter = 'none';
    ctx.shadowColor = 'rgba(0,0,0,0)';
    ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.lineWidth = 1; ctx.lineJoin = 'miter'; ctx.miterLimit = 10;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
  }

  async function render() {
    if (!state.img || state.rendering) { state.dirty = !!state.img; return; }
    state.rendering = true;
    const m = mode();
    $('spinner').classList.add('on');
    setButtons(false);
    await ensureFonts();
    await nextFrame();

    const t0 = performance.now();
    try {
      resetCtx();
      ctx.clearRect(0, 0, OUT, OUT);
      m.render(ctx, {
        img: state.img, meta: state.meta, v: state.values[m.id],
        adj: state.adjust[m.id], W: OUT, H: OUT
      });
    } catch (e) {
      console.error(e);
      resetCtx();
      ctx.fillStyle = '#1a1d24'; ctx.fillRect(0, 0, OUT, OUT);
      ctx.fillStyle = '#ff8a8a'; ctx.font = f(700, 34, FONT.sans);
      ctx.textAlign = 'center';
      ctx.fillText('生成に失敗しました', OUT / 2, OUT / 2 - 20);
      ctx.fillStyle = '#98a2b3'; ctx.font = f(400, 22, FONT.sans);
      ctx.fillText(String(e.message || e).slice(0, 60), OUT / 2, OUT / 2 + 26);
      toast('生成に失敗しました');
    }
    resetCtx();
    console.log('[render] %s %dms', m.id, Math.round(performance.now() - t0));

    // 共有用の Blob を先に作っておく（ユーザー操作直後に share() を呼べるように）
    state.blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    $('spinner').classList.remove('on');
    setButtons(true);
    state.rendering = false;
    if (state.dirty) { state.dirty = false; render(); }
  }

  const renderDebounced = debounce(() => render(), 420);
  function scheduleRender(now) {
    if (!state.img) return;
    if (now) render(); else renderDebounced();
  }

  function setButtons(on) {
    $('btnSave').disabled = !on || !state.img;
    $('btnShare').disabled = !on || !state.img;
  }

  /* ---- 出力 ---- */
  function outName(ext) {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    return `ohayo-${mode().id}-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.${ext}`;
  }
  function downloadBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  function shareText() {
    return SHARE_URL;
  }

  $('btnSave').onclick = async () => {
    const blob = state.blob || await new Promise(r => cv.toBlob(r, 'image/png'));
    downloadBlob(blob, outName('png'));
    toast('画像を保存しました');
  };

  const canShareFiles = (() => {
    try {
      if (!navigator.canShare || !navigator.share) return false;
      const f = new File([new Blob(['x'], { type: 'image/png' })], 't.png', { type: 'image/png' });
      return navigator.canShare({ files: [f] });
    } catch (e) { return false; }
  })();

  $('btnShare').onclick = async () => {
    const text = shareText();
    if (canShareFiles && state.blob) {
      const file = new File([state.blob], outName('png'), { type: 'image/png' });
      try {
        await navigator.share({ files: [file], text });
      } catch (e) {
        if (e && e.name === 'AbortError') return;
        console.warn(e);
        toast('共有できませんでした');
      }
      return;
    }
    // フォールバック: X の intent URL は画像添付に非対応のため、
    // 画像は保存してもらい、テキストだけを埋めた投稿画面を開く
    const blob = state.blob || await new Promise(r => cv.toBlob(r, 'image/png'));
    downloadBlob(blob, outName('png'));
    window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text), '_blank', 'noopener');
    toast('画像を保存しました。Xの投稿画面で添付してください');
  };

  /* ---- 初期化 ---- */
  function init() {
    buildTabs();
    buildFields();
    wireAdjust();
    wireDrop();
    setButtons(false);
    if (!GLX.available()) toast('WebGL2が使えないため一部モードは簡易表示になります');
    ensureFonts();
  }

  return { init, render, toast };
})();

app.init();
</script>
</body>
</html>
